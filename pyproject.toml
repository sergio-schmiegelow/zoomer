[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomer"
version = "0.1.0"
description = "Create zoom videos by fusing pairs of images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "PyQt6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
zoomer = "zoomer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "N", "I"]

[tool.ruff.lint.per-file-ignores]
# Qt requires camelCase overrides such as paintEvent and mousePressEvent.
"src/zoomer/widgets.py" = ["N802"]
"src/zoomer/gui.py" = ["N802"]
